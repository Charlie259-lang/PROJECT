services:
  - type: web
    name: menu-image-checker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOSTED_MODE
        value: "1"
      - key: MAX_PAGES_LIMIT
        value: "150"
      - key: ALLOW_PRIVATE_TARGETS
        value: "0"
