<body>
    <canvas id="fireworks-canvas"></canvas>

            bukan beli putaran gratis ya nyet!

        <div class="input-group">

            <input type="text" id="buyInput" placeholder="Contoh: 400,000 atau 400000" autocomplete="off">

    <script>
        // Format angka dengan koma
        function formatWithComma(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // Fungsi untuk mendapatkan rentang stake berdasarkan nominal buy
        function getStakeRange(buy) {
            if (buy < 400000) {
                return { error: true, message: "Tidak bisa claim karena tidak sesuai kriteria" };
            } else if (buy >= 400000 && buy <= 750000) {
                return { error: false, range: "BET 800 - 1,600" };
            } else if (buy >= 1000000 && buy <= 2000000) {
                return { error: false, range: "BET 2,000 - 4,000" };
            } else if (buy >= 2500000) {
                return { error: false, range: "BET 5,000 - 7,000" };
            } else {
                return { error: true, message: "Nominal tidak termasuk dalam rentang yang tersedia" };
            }
        }

        const buyInput = document.getElementById('buyInput');
        const stakeDisplay = document.getElementById('stakeDisplay');
        const errorMsg = document.getElementById('errorMessage');
        const copyButton = document.getElementById('copyButton');

        // Event input dengan format otomatis
        buyInput.addEventListener('input', function(e) {
            const input = e.target;
            let cursorPos = input.selectionStart;
            let val = input.value;

            // Hapus semua karakter non-digit
            let digits = val.replace(/\D/g, '');
            if (digits === '') {
                input.value = '';
                stakeDisplay.textContent = '-';
                errorMsg.textContent = '';
                return;
            }

            // Hitung jumlah koma sebelum perubahan
            let commaCountBefore = (val.slice(0, cursorPos).match(/,/g) || []).length;

            // Format angka dengan koma
            let num = parseInt(digits, 10);
            let formatted = num.toLocaleString('en-US');
            input.value = formatted;

            // Sesuaikan posisi kursor
            let commaCountAfter = (formatted.slice(0, cursorPos).match(/,/g) || []).length;
            let newCursorPos = cursorPos + (commaCountAfter - commaCountBefore);
            newCursorPos = Math.min(newCursorPos, formatted.length);
            input.setSelectionRange(newCursorPos, newCursorPos);

            // Tentukan rentang stake
            let result = getStakeRange(num);
            if (!result.error) {
                stakeDisplay.textContent = result.range;
                errorMsg.textContent = '';
            } else {
                stakeDisplay.textContent = '—';
                errorMsg.textContent = '🍌 ' + result.message;
            }
        });

        buyInput.addEventListener('blur', function() {
            let val = this.value;
            let digits = val.replace(/\D/g, '');
            if (digits) {
                this.value = parseInt(digits, 10).toLocaleString('en-US');
            }
        });

        // --- TOMBOL COPY DENGAN FALLBACK (execCommand) ---
        copyButton.addEventListener('click', function() {
            let textToCopy = stakeDisplay.textContent;

            if (textToCopy === '-' || textToCopy === '—' || textToCopy === '') {
                alert('Tidak ada teks untuk disalin!');
                return;
            }

            // Fungsi copy dengan fallback
            function copyToClipboard(text) {
                // Coba Clipboard API modern jika tersedia dan tidak di-blokir
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(function(err) {
                        console.warn('Clipboard API gagal, gunakan fallback:', err);
                        fallbackCopyText(text);
                    });
                } else {
                    fallbackCopyText(text);
                }
            }

            function fallbackCopyText(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;

                // Buat textarea tidak terlihat
                textArea.style.position = 'fixed';
                textArea.style.top = '-9999px';
                textArea.style.left = '-9999px';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);

                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        alert('Stake berhasil disalin: ' + text);
                    } else {
                        alert('Gagal menyalin menggunakan metode alternatif.');
                    }
                } catch (err) {
                    alert('Gagal menyalin teks: ' + err);
                } finally {
                    document.body.removeChild(textArea);
                }
            }

            copyToClipboard(textToCopy);
        });
    </script>

    <!-- Script kembang api super meriah -->
    <script>
        (function() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const MAX_PARTICLES = 600;
            const GRAVITY = 0.03;
            const FIREWORK_CHANCE = 0.06;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function random(min, max) {
                return Math.random() * (max - min) + min;
            }

            function createExplosion(x, y, customColor = null) {
                const count = 50 + Math.floor(Math.random() * 70);
                const baseHue = customColor !== null ? customColor : Math.random() * 360;
                for (let i = 0; i < count; i++) {
                    const angle = random(0, Math.PI * 2);
                    const speed = random(2, 8);
                    const hue = (baseHue + random(-30, 30)) % 360;
                    const color = `hsl(${hue}, 100%, 65%)`;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        maxLife: 1.0,
                        color: color,
                        size: random(3, 8)
                    });
                }
            }

            function createDoubleExplosion(x, y) {
                const hue1 = Math.random() * 360;
                const hue2 = (hue1 + 180) % 360;
                createExplosion(x - 20, y - 20, hue1);
                createExplosion(x + 20, y + 20, hue2);
            }

            function createBigExplosion(x, y) {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        createExplosion(x + random(-50, 50), y + random(-30, 30), random(0, 360));
                    }, i * 50);
                }
            }

            function initFireworks() {
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        const x = random(width * 0.2, width * 0.8);
                        const y = random(height * 0.1, height * 0.4);
                        if (i % 3 === 0) createDoubleExplosion(x, y);
                        else createExplosion(x, y);
                    }, i * 150);
                }
            }
            setTimeout(initFireworks, 200);

            function update() {
                if (Math.random() < FIREWORK_CHANCE) {
                    const x = random(width * 0.1, width * 0.9);
                    const y = random(height * 0.1, height * 0.5);
                    const r = Math.random();
                    if (r < 0.3) {
                        createDoubleExplosion(x, y);
                    } else if (r < 0.6) {
                        createBigExplosion(x, y);
                    } else {
                        createExplosion(x, y);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += GRAVITY;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                    p.life -= 0.005;
                    if (p.life <= 0 || p.y > height + 100 || p.x < -100 || p.x > width + 100) {
                        particles.splice(i, 1);
                    }
                }

                if (particles.length > MAX_PARTICLES) {
                    particles = particles.slice(-MAX_PARTICLES);
                }
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                ctx.globalCompositeOperation = 'lighter';
                for (let p of particles) {
                    ctx.globalAlpha = p.life * 0.9;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = p.life * 0.4;
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(p.x - 2, p.y - 2, p.size * 0.5 * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
