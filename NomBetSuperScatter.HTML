<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli putaran super • SUHAN MONYET CERIA</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://cdn.areabermain.club/assets/cdn/az6/2026/01/31/20260131/4e4f8669c6027205f69ac8a2c0bbaf83/linetogel-bg-imlek2026.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        /* Overlay gelap pada body - dipertegas */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45); /* lebih gelap */
            z-index: 0;
        }
        .card {
            background: rgba(255, 245, 255, 0.9);
            backdrop-filter: blur(5px);
            max-width: 500px;
            width: 100%;
            border-radius: 40px;
            /* Shadow lebih kompleks dan dramatis */
            box-shadow: 
                0 40px 60px rgba(0, 0, 0, 0.7),      /* bayangan utama besar */
                0 15px 25px rgba(0, 0, 0, 0.5),      /* bayangan kedua lebih dekat */
                0 0 0 2px rgba(255, 255, 255, 0.15) inset; /* inner light */
            padding: 30px;
            border: 3px solid #f0d0ff;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .card::before {
            content: "";
            position: absolute;
            top: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            background: rgba(200, 150, 255, 0.2);
            border-radius: 50%;
            z-index: 0;
        }
        .monkey-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: #6a4c9c;
            color: #f9eaff;
            padding: 15px 20px;
            border-radius: 60px;
            box-shadow: 0 8px 0 #4a2d6e, 0 10px 20px rgba(0,0,0,0.3);
            transform: translateY(-5px);
            position: relative;
            z-index: 2;
        }
        .monkey-icon {
            font-size: 48px;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2));
            animation: monkeyWiggle 3s infinite ease-in-out;
        }
        .monkey-text {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #4a2d6e;
        }
        .monkey-text small {
            display: block;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.9;
        }
        @keyframes monkeyWiggle {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #4a2d6e;
            margin: 15px 0 5px;
            text-align: center;
            text-shadow: 3px 3px 0 #d9b0ff;
            position: relative;
            z-index: 2;
        }
        .subhead {
            text-align: center;
            color: #5f3b8c;
            margin-bottom: 25px;
            font-size: 16px;
            font-style: italic;
            background: #eeddff;
            padding: 8px 15px;
            border-radius: 40px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 2px 5px rgba(90, 30, 130, 0.1), 0 5px 10px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }
        .input-group {
            margin: 25px 0 20px;
            position: relative;
            z-index: 2;
        }
        label {
            display: block;
            font-weight: 700;
            color: #3e2a5c;
            margin-bottom: 10px;
            font-size: 18px;
            margin-left: 10px;
            text-shadow: 1px 1px 0 white;
        }
        label i {
            color: #9f6ee7;
            margin-right: 8px;
        }
        input {
            width: 100%;
            padding: 18px 22px;
            border: 3px solid #b591e2;
            border-radius: 50px;
            font-size: 20px;
            box-sizing: border-box;
            transition: 0.2s;
            background: #fcf0ff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 5px 0 #7f58b3, 0 10px 15px rgba(0,0,0,0.3);
            font-weight: 500;
            color: #2a1b3d;
        }
        input:focus {
            border-color: #c289f0;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 5px 0 #6a3f9e, 0 0 0 4px rgba(180, 130, 240, 0.3), 0 10px 15px rgba(0,0,0,0.4);
            background: #ffffff;
        }
        .result {
            background: #f3e5ff;
            border-radius: 40px;
            padding: 25px;
            border: 3px solid #b384dd;
            box-shadow: 0 8px 0 #764db3, inset 0 -2px 5px rgba(255,255,255,0.7), 0 15px 25px rgba(0,0,0,0.4);
            margin-top: 30px;
            position: relative;
            z-index: 2;
        }
        .result-label {
            font-weight: 600;
            color: #4d2e7a;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .result-label i {
            font-size: 28px;
            color: #a06bd9;
        }
        .result-value {
            font-size: 52px;
            font-weight: 800;
            color: #311b50;
            line-height: 1.1;
            margin-top: 10px;
            word-break: break-word;
            text-shadow: 3px 3px 0 #dbb5ff;
            background: #f5eaff;
            display: inline-block;
            padding: 0 20px 5px 20px;
            border-radius: 40px;
            border: 2px dashed #b384dd;
        }
        .not-found {
            color: #a13d3d;
            font-size: 20px;
            font-weight: 600;
            margin-top: 15px;
            background: #ffe6f0;
            padding: 10px 20px;
            border-radius: 40px;
            border-left: 8px solid #b22222;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        .info-note {
            text-align: center;
            color: #4f3a70;
            font-size: 14px;
            margin-top: 25px;
            background: #e9d5ff;
            padding: 10px 15px;
            border-radius: 50px;
            border: 1px solid #b591e2;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }
        .monkey-decoration {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 5px;
            font-size: 24px;
            color: #6a4c9c;
            position: relative;
            z-index: 2;
        }
        .monkey-decoration span {
            background: #eedbff;
            padding: 8px 12px;
            border-radius: 50px;
            box-shadow: 0 3px 0 #7f58b3, 0 5px 10px rgba(0,0,0,0.2);
        }
        .footer-animation {
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
            animation: bounce 2s infinite;
            color: #5f3b8c;
            position: relative;
            z-index: 2;
            text-shadow: 1px 1px 0 white;
        }
        @keyframes bounce {
            0%,100%{ transform: translateY(0); }
            50%{ transform: translateY(-5px); }
        }
        .fa-monkey {
            color: #8b5a2b;
        }
        .fa-banana {
            color: #f7d44a;
        }
        .monkey-header .fa-monkey {
            color: #ffd966;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Header SUHAN MONYET CERIA -->
        <div class="monkey-header">
            <div class="monkey-icon">
                <i class="fas fa-monkey"></i>
            </div>
            <div class="monkey-text">
                🐒 SUHAN MONYET CERIA
                <small>Koma itu teman monyet</small>
            </div>
        </div>

        <!-- Judul -->
        <h1>🍌 BELI PUTARAN GRATIS SUPER</h1>

        <!-- Teks peringatan di tengah -->
        <div class="subhead">
            <i class="fas fa-crown" style="color:#8a5fd0;"></i> 
            bukan beli putaran gratis ya nyet! 
            <i class="fas fa-crown" style="color:#8a5fd0;"></i>
        </div>

        <!-- Input utama -->
        <div class="input-group">
            <label for="buyInput"><i class="fas fa-gem"></i> Buy Super Spin (Rp)</label>
            <input type="text" id="buyInput" placeholder="Contoh: 400,000 atau 400000" autocomplete="off">
        </div>

        <!-- Hasil stake -->
        <div class="result" id="resultBox">
            <div class="result-label">
                <i class="fas fa-paw"></i> Stake Bermain :
                <i class="fas fa-banana" style="margin-left:auto; opacity:0.8;"></i>
            </div>
            <div class="result-value" id="stakeDisplay">-</div>
            <div id="errorMessage" class="not-found"></div>
        </div>

        <!-- Hiasan monyet -->
        <div class="monkey-decoration">
            <span><i class="fas fa-monkey"></i>  🍇  <i class="fas fa-monkey"></i></span>
            <span><i class="fas fa-banana"></i>  🐒  <i class="fas fa-banana"></i></span>
        </div>

        <!-- Info note -->
        <div class="info-note">
            <i class="fas fa-check-circle" style="color:#5f2e91;"></i> Pakai koma ya (contoh: 1,500,000).
        </div>

        <!-- Animasi monyet kecil -->
        <div class="footer-animation">
            <i class="fas fa-monkey" style="color:#7a4d9e;"></i>
            <i class="fas fa-leaf" style="color:#6b3f9b;"></i>
            <i class="fas fa-monkey" style="color:#7a4d9e; transform: scaleX(-1); display: inline-block;"></i>
        </div>
    </div>

    <script>
        // Data lengkap
        const data = [
            { buy: 600000000, stake: 1200000 },
            { buy: 500000000, stake: 1000000 },
            { buy: 450000000, stake: 900000 },
            { buy: 400000000, stake: 800000 },
            { buy: 350000000, stake: 700000 },
            { buy: 300000000, stake: 600000 },
            { buy: 250000000, stake: 500000 },
            { buy: 200000000, stake: 400000 },
            { buy: 150000000, stake: 300000 },
            { buy: 100000000, stake: 200000 },
            { buy: 75000000, stake: 150000 },
            { buy: 50000000, stake: 100000 },
            { buy: 45000000, stake: 90000 },
            { buy: 40000000, stake: 80000 },
            { buy: 30000000, stake: 60000 },
            { buy: 25000000, stake: 50000 },
            { buy: 20000000, stake: 40000 },
            { buy: 15000000, stake: 30000 },
            { buy: 10000000, stake: 20000 },
            { buy: 7500000, stake: 15000 },
            { buy: 5000000, stake: 10000 },
            { buy: 4500000, stake: 9000 },
            { buy: 4000000, stake: 8000 },
            { buy: 3500000, stake: 7000 },
            { buy: 3000000, stake: 6000 },
            { buy: 2500000, stake: 5000 },
            { buy: 2000000, stake: 4000 },
            { buy: 1500000, stake: 3000 },
            { buy: 1000000, stake: 2000 },
            { buy: 750000, stake: 1500 },
            { buy: 500000, stake: 1000 },
            { buy: 400000, stake: 800 },
            { buy: 300000, stake: 600 },
            { buy: 200000, stake: 400 },
            { buy: 100000, stake: 200 }
        ];

        function formatWithComma(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function cleanNumber(str) {
            return str.replace(/[^\d]/g, '');
        }

        function findStake(buyNumber) {
            return data.find(item => item.buy === buyNumber);
        }

        const buyInput = document.getElementById('buyInput');
        const stakeDisplay = document.getElementById('stakeDisplay');
        const errorMsg = document.getElementById('errorMessage');

        buyInput.addEventListener('input', function(e) {
            const raw = e.target.value;
            const digits = cleanNumber(raw);

            if (digits === '') {
                stakeDisplay.textContent = '-';
                errorMsg.textContent = '';
                return;
            }

            const buyValue = parseInt(digits, 10);
            const found = findStake(buyValue);

            if (found) {
                stakeDisplay.textContent = formatWithComma(found.stake);
                errorMsg.textContent = '';
            } else {
                stakeDisplay.textContent = '—';
                errorMsg.textContent = '🍌 Waduh, nominal tidak ada di daftar! Coba lagi.';
            }
        });
    </script>
</body>
</html>
