<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekonsiliasi QRIS 3 Sumber</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0; --primary: #2563eb; --danger: #dc2626; --success: #10b981; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 950px; margin: auto; background: var(--card); padding: 24px; border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-bottom: 12px; font-size: 1.6rem; }
    .warning { background: #fff3cd; color: #856404; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 18px; text-align: center; border: 1px solid #ffeaa7; }
    .input-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
    select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #f8fafc; }
    .sources-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .source-box { background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid var(--border); position: relative; }
    .source-box h3 { margin-bottom: 10px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
    textarea { min-height: 120px; resize: vertical; font-family: monospace; font-size: 0.85rem; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .drop-zone { margin-top: 8px; padding: 10px; border: 2px dashed #cbd5e1; border-radius: 8px; text-align: center; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .btn-clipboard { background: #f1f5f9; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-left: auto; }
    .btn-clear { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; margin-left: 8px; }
    button.process { background: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.2s; }
    button.process:hover { background: #1d4ed8; }
    button.process:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 16px; text-align: center; font-weight: 500; min-height: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.85rem; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #f8fafc; position: sticky; top: 0; }
    .diff-high { color: var(--danger); font-weight: bold; }
    .export-btn { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; display: none; }
    .hidden { display: none; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Rekonsiliasi QRIS (MINERAPAY | ZONAMAIN | IDN)</h1>
    <div class="warning">⚠️ API Key sudah terpasang otomatis. Jangan bagikan file ini ke publik untuk keamanan akun.</div>
    
    <div class="input-group">
      <label>🤖 Model AI</label>
      <select id="modelSelect">
        <option value="openai/gpt-4o-mini">gpt-4o-mini (Cepat & Akurat)</option>
        <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B (Hemat)</option>
        <option value="google/gemma-2-9b-it">Gemma 2 9B (Alternatif)</option>
      </select>
    </div>

    <div class="sources-grid">
      <div class="source-box" id="box-minera">
        <h3>📦 MINERAPAY <div><button class="btn-clipboard" onclick="pasteFromClipboard('paste-minera')">📋 Paste</button><button class="btn-clear" onclick="clearSource('paste-minera')">✖</button></div></h3>
        <textarea id="paste-minera" placeholder="Paste data CSV/Excel/TXT di sini..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-minera').click()">📁 Drop file atau klik</div>
        <input type="file" id="file-minera" class="hidden" accept=".csv,.txt,.xlsx,.json" onchange="handleFile(this, 'paste-minera')">
      </div>

      <div class="source-box" id="box-zona">
        <h3>📦 ZONAMAIN <div><button class="btn-clipboard" onclick="pasteFromClipboard('paste-zona')">📋 Paste</button><button class="btn-clear" onclick="clearSource('paste-zona')">✖</button></div></h3>
        <textarea id="paste-zona" placeholder="Paste data CSV/Excel/TXT di sini..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-zona').click()">📁 Drop file atau klik</div>
        <input type="file" id="file-zona" class="hidden" accept=".csv,.txt,.xlsx,.json" onchange="handleFile(this, 'paste-zona')">
      </div>

      <div class="source-box" id="box-idn">
        <h3>📦 IDN <div><button class="btn-clipboard" onclick="pasteFromClipboard('paste-idn')">📋 Paste</button><button class="btn-clear" onclick="clearSource('paste-idn')">✖</button></div></h3>
        <textarea id="paste-idn" placeholder="Paste data CSV/Excel/TXT di sini..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-idn').click()">📁 Drop file atau klik</div>
        <input type="file" id="file-idn" class="hidden" accept=".csv,.txt,.xlsx,.json" onchange="handleFile(this, 'paste-idn')">
      </div>
    </div>

    <button class="process" id="btnProcess" onclick="startReconciliation()">🚀 Proses Rekonsiliasi</button>
    <div id="status"></div>

    <div id="resultContainer" class="hidden">
      <table id="resultTable">
        <thead>
          <tr>
            <th>TRX ID</th>
            <th>MINERAPAY</th>
            <th>ZONAMAIN</th>
            <th>IDN</th>
            <th>Selisih Max</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <button class="export-btn" id="btnExport" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <script>
    // 🔑 KONFIGURASI INTERNAL
    const CONFIG = {
      API_KEY: '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',
      API_URL: 'https://openrouter.ai/api/v1/chat/completions',
      REFERER: window.location.href
    };

    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btnProcess');
    let discrepancies = [];

    function log(msg) { statusEl.innerHTML = `<span class="spinner"></span> ${msg}`; statusEl.style.color = '#2563eb'; }
    function success(msg) { statusEl.innerHTML = `✅ ${msg}`; statusEl.style.color = '#10b981'; }
    function error(msg) { statusEl.innerHTML = `❌ ${msg}`; statusEl.style.color = '#dc2626'; }

    // Drag & Drop Setup
    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) handleFileInput(file, zone.previousElementSibling.id);
      });
    });

    function handleFile(input, targetId) {
      if (input.files[0]) handleFileInput(input.files[0], targetId);
    }

    async function handleFileInput(file, targetId) {
      log(`Membaca ${file.name}...`);
      try {
        let text = '';
        if (file.name.endsWith('.xlsx')) {
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          text = XLSX.utils.sheet_to_csv(ws);
        } else {
          text = await file.text();
        }
        document.getElementById(targetId).value = text;
        success(`File ${file.name} berhasil dimuat.`);
      } catch (err) {
        error(`Gagal membaca file: ${err.message}`);
      }
    }

    async function pasteFromClipboard(targetId) {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById(targetId).value = text;
        success('Data dari clipboard berhasil ditempel.');
      } catch (err) {
        error('Gagal akses clipboard. Gunakan Ctrl+V manual.');
      }
    }

    function clearSource(targetId) {
      document.getElementById(targetId).value = '';
    }

    async function parseWithAI(raw, source, model) {
      const trimmed = raw.length > 3000 ? raw.substring(0, 3000) + '\n...(data dipotong untuk efisiensi token)' : raw;
      const prompt = `Anda adalah parser data transaksi QRIS. Ekstrak data mentah ${source} berikut menjadi JSON array. Setiap objek WAJIB punya: "trx_id" (unik), "amount" (angka, tanpa simbol), "status" (success/failed/pending/refunded), "timestamp" (ISO atau kosong). Abaikan header/footer tidak relevan. Jangan buat data. Output HARUS valid JSON dengan key "transactions".\n\nData:\n${trimmed}`;
      
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${CONFIG.API_KEY}`,
          'HTTP-Referer': CONFIG.REFERER,
          'X-Title': 'QRIS Reconciler'
        },
        body: JSON.stringify({
          model,
          messages: [{ role: 'user', content: prompt }],
          temperature: 0,
          response_format: { type: 'json_object' }
        })
      });
      if (!res.ok) throw new Error(`API Error: ${res.status} ${res.statusText}`);
      const json = await res.json();
      const content = json.choices[0].message.content;
      let parsed = JSON.parse(content);
      return Array.isArray(parsed) ? parsed : (parsed.transactions || []);
    }

    function reconcile(dataA, dataB, dataC) {
      const toMap = (arr) => new Map(arr.map(d => [String(d.trx_id).trim(), d]));
      const mA = toMap(dataA), mB = toMap(dataB), mC = toMap(dataC);
      const allIds = new Set([...mA.keys(), ...mB.keys(), ...mC.keys()]);
      const result = [];

      for (const id of allIds) {
        const a = mA.get(id) || { amount: 0, status: 'missing' };
        const b = mB.get(id) || { amount: 0, status: 'missing' };
        const c = mC.get(id) || { amount: 0, status: 'missing' };

        const dAB = Math.abs((a.amount||0) - (b.amount||0));
        const dAC = Math.abs((a.amount||0) - (c.amount||0));
        const dBC = Math.abs((b.amount||0) - (c.amount||0));
        const maxDiff = Math.max(dAB, dAC, dBC);
        
        const statuses = [a.status, b.status, c.status].filter(s => s !== 'missing');
        const statusMismatch = statuses.length > 0 && new Set(statuses).size > 1;

        if (maxDiff > 1 || statusMismatch) {
          result.push({
            trx_id: id,
            a_amt: a.amount, a_st: a.status,
            b_amt: b.amount, b_st: b.status,
            c_amt: c.amount, c_st: c.status,
            max_diff: maxDiff.toFixed(2),
            issue: statusMismatch ? 'Status tidak match' : 'Nominal berbeda'
          });
        }
      }
      return result.sort((a,b) => b.max_diff - a.max_diff);
    }

    async function startReconciliation() {
      const model = document.getElementById('modelSelect').value;
      const rawA = document.getElementById('paste-minera').value.trim();
      const rawB = document.getElementById('paste-zona').value.trim();
      const rawC = document.getElementById('paste-idn').value.trim();
      
      if (!rawA || !rawB || !rawC) return error('Data ketiga sumber wajib diisi (paste/drop file)');

      btn.disabled = true;
      document.getElementById('resultContainer').classList.add('hidden');
      try {
        log('AI mem-parsing MINERAPAY...');
        const dataA = await parseWithAI(rawA, 'MINERAPAY', model);
        log('AI mem-parsing ZONAMAIN...');
        const dataB = await parseWithAI(rawB, 'ZONAMAIN', model);
        log('AI mem-parsing IDN...');
        const dataC = await parseWithAI(rawC, 'IDN', model);

        success(`Parsing selesai (${dataA.length} | ${dataB.length} | ${dataC.length}). Menghitung selisih...`);
        discrepancies = reconcile(dataA, dataB, dataC);
        renderTable(discrepancies);
      } catch (err) {
        error(err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#10b981; font-weight:500;">✅ Tidak ditemukan selisih. Semua data match sempurna!</td></tr>';
        document.getElementById('resultContainer').classList.remove('hidden');
        document.getElementById('btnExport').style.display = 'none';
        return;
      }

      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${row.trx_id}</strong></td>
          <td>Rp ${(row.a_amt||0).toLocaleString('id-ID')}<br><small style="color:${row.a_st==='success'?'#10b981':row.a_st==='failed'?'#dc2626':'#f59e0b'}">${row.a_st}</small></td>
          <td>Rp ${(row.b_amt||0).toLocaleString('id-ID')}<br><small style="color:${row.b_st==='success'?'#10b981':row.b_st==='failed'?'#dc2626':'#f59e0b'}">${row.b_st}</small></td>
          <td>Rp ${(row.c_amt||0).toLocaleString('id-ID')}<br><small style="color:${row.c_st==='success'?'#10b981':row.c_st==='failed'?'#dc2626':'#f59e0b'}">${row.c_st}</small></td>
          <td class="${row.max_diff > 500 ? 'diff-high' : ''}">Rp ${row.max_diff}</td>
          <td>${row.issue}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('resultContainer').classList.remove('hidden');
      document.getElementById('btnExport').style.display = 'block';
      success(`Ditemukan ${data.length} transaksi berselisih. Urutkan dari selisih terbesar.`);
    }

    function exportCSV() {
      if (!discrepancies.length) return;
      let csv = 'TRX_ID,MINERAPAY_AMOUNT,MINERAPAY_STATUS,ZONAMAIN_AMOUNT,ZONAMAIN_STATUS,IDN_AMOUNT,IDN_STATUS,MAX_SELISIH,KETERANGAN\n';
      discrepancies.forEach(r => {
        csv += `"${r.trx_id}",${r.a_amt||0},${r.a_st},${r.b_amt||0},${r.b_st},${r.c_amt||0},${r.c_st},${r.max_diff},"${r.issue}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `selisih_qris_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
