<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekonsiliasi QRIS 3 Sumber</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0; --primary: #2563eb; --danger: #dc2626; --success: #10b981; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: auto; background: var(--card); padding: 24px; border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-bottom: 12px; font-size: 1.6rem; }
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
    .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    label { font-weight: 500; font-size: 0.9rem; }
    select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #f8fafc; }
    .api-key-box { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; }
    .api-key-box input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 0.85rem; }
    .sources-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .source-box { background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid var(--border); }
    .source-box h3 { margin-bottom: 10px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
    textarea { min-height: 120px; resize: vertical; font-family: monospace; font-size: 0.85rem; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .drop-zone { margin-top: 8px; padding: 10px; border: 2px dashed #cbd5e1; border-radius: 8px; text-align: center; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-clipboard { background: #f1f5f9; border: 1px solid var(--border); }
    .btn-clear { background: none; color: var(--danger); }
    .btn-primary { background: var(--primary); color: white; padding: 14px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-test { background: #64748b; color: white; padding: 10px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; margin-bottom: 12px; }
    #status { margin-top: 12px; text-align: center; font-weight: 500; min-height: 24px; padding: 8px; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.85rem; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #f8fafc; position: sticky; top: 0; }
    .diff-high { color: var(--danger); font-weight: bold; }
    .export-btn { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; display: none; }
    .hidden { display: none; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Rekonsiliasi QRIS</h1>
    
    <div class="alert alert-warning">
      ⚠️ <strong>Error "User not found"</strong> = API Key tidak terdaftar di OpenRouter. Gunakan Mode Offline atau perbaiki API Key.
    </div>

    <!-- API KEY SECTION -->
    <div class="api-key-box">
      <label style="display:block; margin-bottom:6px;">🔑 OpenRouter API Key:</label>
      <input type="password" id="apiKeyInput" value="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" readonly>
      <button class="btn btn-test" onclick="testApiKey()" style="margin-top:8px;">🔍 Test Koneksi API</button>
      <div id="apiStatus"></div>
    </div>

    <div class="controls">
      <label>🤖 Model:</label>
      <select id="modelSelect">
        <option value="openai/gpt-4o-mini">gpt-4o-mini</option>
        <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B</option>
      </select>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="offlineMode"> 📴 Mode Offline (Tanpa API)
      </label>
    </div>

    <div id="status"></div>

    <div class="sources-grid">
      <div class="source-box">
        <h3>📦 MINERAPAY 
          <div>
            <button class="btn btn-clipboard" onclick="pasteFromClipboard('paste-minera')">📋 Paste</button>
            <button class="btn btn-clear" onclick="clearSource('paste-minera')">✖</button>
          </div>
        </h3>
        <textarea id="paste-minera" placeholder="Paste data MINERAPAY..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-minera').click()">📁 Drop file</div>
        <input type="file" id="file-minera" class="hidden" accept=".csv,.txt,.xlsx" onchange="handleFile(this, 'paste-minera')">
      </div>

      <div class="source-box">
        <h3>📦 ZONAMAIN 
          <div>
            <button class="btn btn-clipboard" onclick="pasteFromClipboard('paste-zona')">📋 Paste</button>
            <button class="btn btn-clear" onclick="clearSource('paste-zona')">✖</button>
          </div>
        </h3>
        <textarea id="paste-zona" placeholder="Paste data ZONAMAIN..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-zona').click()">📁 Drop file</div>
        <input type="file" id="file-zona" class="hidden" accept=".csv,.txt,.xlsx" onchange="handleFile(this, 'paste-zona')">
      </div>

      <div class="source-box">
        <h3>📦 IDN 
          <div>
            <button class="btn btn-clipboard" onclick="pasteFromClipboard('paste-idn')">📋 Paste</button>
            <button class="btn btn-clear" onclick="clearSource('paste-idn')">✖</button>
          </div>
        </h3>
        <textarea id="paste-idn" placeholder="Paste data IDN..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-idn').click()">📁 Drop file</div>
        <input type="file" id="file-idn" class="hidden" accept=".csv,.txt,.xlsx" onchange="handleFile(this, 'paste-idn')">
      </div>
    </div>

    <button class="btn-primary" id="btnProcess" onclick="startReconciliation()">🚀 Proses Rekonsiliasi</button>

    <div id="resultContainer" class="hidden">
      <h3 style="margin-top:24px; margin-bottom:12px;">🎯 Hasil Selisih</h3>
      <table id="resultTable">
        <thead>
          <tr><th>Rule</th><th>Reference</th><th>MINERAPAY</th><th>ZONAMAIN</th><th>IDN</th><th>Selisih</th><th>Keterangan</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <button class="export-btn" id="btnExport" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <script>
    let API_KEY = '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';
    const API_URL = 'https://openrouter.ai/api/v1';
    let discrepancies = [];

    const statusEl = document.getElementById('status');
    const apiStatusEl = document.getElementById('apiStatus');

    function log(msg, type='info') {
      const colors = { success: '#065f46', error: '#991b1b', info: '#2563eb' };
      const bg = { success: '#d1fae5', error: '#fee2e2', info: '#f8fafc' };
      statusEl.style.color = colors[type];
      statusEl.style.background = bg[type];
      statusEl.innerHTML = type==='loading' ? `<span class="spinner"></span> ${msg}` : msg;
    }

    async function testApiKey() {
      apiStatusEl.innerHTML = '<span class="spinner"></span> Testing...';
      try {
        const res = await fetch(`${API_URL}/auth/key`, {
          headers: { 'Authorization': `Bearer ${API_KEY}`, 'HTTP-Referer': window.location.href }
        });
        const data = await res.json();
        if (res.ok) {
          apiStatusEl.innerHTML = `<div class="alert alert-success">✅ Key valid! User: ${data.data?.email || 'N/A'}</div>`;
        } else {
          apiStatusEl.innerHTML = `<div class="alert alert-error">❌ Error ${res.status}: ${data.error?.message || 'Invalid key'}</div>`;
        }
      } catch (e) {
        apiStatusEl.innerHTML = `<div class="alert alert-error">❌ Gagal koneksi: ${e.message}</div>`;
      }
    }

    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', e => {
        e.preventDefault(); zone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleFileInput(e.dataTransfer.files[0], zone.previousElementSibling.id);
      });
    });

    function handleFile(input, targetId) { if (input.files[0]) handleFileInput(input.files[0], targetId); }
    async function handleFileInput(file, targetId) {
      log(`Membaca ${file.name}...`, 'loading');
      try {
        let text = file.name.endsWith('.xlsx') 
          ? XLSX.utils.sheet_to_csv(XLSX.read(await file.arrayBuffer(), {type:'array'}).Sheets[XLSX.read(await file.arrayBuffer(), {type:'array'}).SheetNames[0]])
          : await file.text();
        document.getElementById(targetId).value = text;
        log(`File ${file.name} dimuat.`, 'success');
      } catch (err) { log(`Gagal: ${err.message}`, 'error'); }
    }

    async function pasteFromClipboard(targetId) {
      try {
        document.getElementById(targetId).value = await navigator.clipboard.readText();
        log('Clipboard ditempel.', 'success');
      } catch (err) { log('Gagal akses clipboard.', 'error'); }
    }
    function clearSource(targetId) { document.getElementById(targetId).value = ''; }

    // OFFLINE PARSER (Tanpa AI)
    function parseMinerapayOffline(text) {
      const lines = text.trim().split('\n').filter(l => l.trim());
      return lines.map(line => {
        const cols = line.split('\t');
        return {
          order_id: (cols[1] || '').trim(),
          user_id: ((cols[20] || '').split('||')[0] || '').trim(),
          amount: parseFloat(cols[2]) || 0,
          status: (cols[6] || 'success').trim()
        };
      }).filter(d => d.order_id);
    }

    function parseZonamainOffline(text) {
      const lines = text.trim().split('\n').filter(l => l.trim());
      return lines.map(line => {
        const cols = line.split('\t');
        const amountStr = (cols[8] || '0').replace(/,/g, '');
        return {
          order_id: (cols[3] || '').trim(),
          user_id: (cols[6] || '').trim(),
          amount: parseFloat(amountStr) || 0,
          status: 'success'
        };
      }).filter(d => d.order_id);
    }

    function parseIdnOffline(text) {
      // Fallback: coba extract angka dan ID
      const lines = text.trim().split('\n').filter(l => l.trim());
      return lines.map((line, idx) => ({
        order_id: `IDN_${idx}`,
        user_id: `USER_${idx}`,
        amount: parseFloat(line.replace(/[^0-9.]/g, '')) || 0,
        status: 'success'
      }));
    }

    async function parseWithAI(text, source, model) {
      const prompt = source === 'MINERAPAY' 
        ? `Parse MINERAPAY data (TAB-separated). Kolom: [0]UUID, [1]OrderID, [2]Amount, [6]Status, [20]User. Output JSON {transactions: [{order_id, user_id, amount, status}]}. Data: ${text.substring(0,3000)}`
        : source === 'ZONAMAIN'
        ? `Parse ZONAMAIN data (TAB-separated). Kolom: [3]OrderID, [6]Username, [8]Amount. Output JSON {transactions: [{order_id, user_id, amount, status}]}. Data: ${text.substring(0,3000)}`
        : `Parse IDN data. Output JSON {transactions: [{order_id, user_id, amount, status}]}. Data: ${text.substring(0,3000)}`;

      const res = await fetch(`${API_URL}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}`, 'HTTP-Referer': window.location.href, 'X-Title': 'QRIS' },
        body: JSON.stringify({ model, messages: [{role:'user', content: prompt}], temperature: 0, response_format: {type:'json_object'} })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || `API ${res.status}`);
      }
      
      const json = await res.json();
      const parsed = JSON.parse(json.choices[0].message.content);
      return parsed.transactions || [];
    }

    function reconcile(minera, zona, idn) {
      const results = [];
      const norm = (v) => String(v||'').trim().toLowerCase();
      const amt = (v) => parseFloat(v) || 0;
      const add = (rule, ref, m, z, i, sel, issue) => results.push({rule, ref, m, z, i, sel, issue});

      // M ↔ Z by Order ID
      const zMap = new Map(zona.filter(z=>z.order_id).map(z => [norm(z.order_id), z]));
      const mUsed = new Set();
      
      minera.forEach(m => {
        if (!m.order_id) return;
        const oid = norm(m.order_id);
        mUsed.add(oid);
        const z = zMap.get(oid);
        if (!z) add('M↔Z', oid, m, null, null, amt(m.amount), 'Tidak di ZONAMAIN');
        else if (Math.abs(amt(m.amount) - amt(z.amount)) > 0.01) {
          add('M↔Z', oid, m, z, null, Math.abs(amt(m.amount)-amt(z.amount)), 'Selisih nominal');
        }
      });

      zona.filter(z => z.order_id && !mUsed.has(norm(z.order_id))).forEach(z => {
        add('M↔Z', norm(z.order_id), null, z, null, amt(z.amount), 'Tidak di MINERAPAY');
      });

      return results.sort((a,b) => b.sel - a.sel);
    }

    async function startReconciliation() {
      const offline = document.getElementById('offlineMode').checked;
      const rawA = document.getElementById('paste-minera').value.trim();
      const rawB = document.getElementById('paste-zona').value.trim();
      const rawC = document.getElementById('paste-idn').value.trim();
      
      if (!rawA || !rawB || !rawC) return log('⚠️ Isi ketiga data sumber', 'error');

      btn.disabled = true;
      document.getElementById('resultContainer').classList.add('hidden');

      try {
        let dA, dB, dC;
        
        if (offline) {
          log('Mode Offline: Parsing manual...', 'loading');
          dA = parseMinerapayOffline(rawA);
          dB = parseZonamainOffline(rawB);
          dC = parseIdnOffline(rawC);
        } else {
          const model = document.getElementById('modelSelect').value;
          log('Parsing dengan AI...', 'loading');
          dA = await parseWithAI(rawA, 'MINERAPAY', model);
          dB = await parseWithAI(rawB, 'ZONAMAIN', model);
          dC = await parseWithAI(rawC, 'IDN', model);
        }

        log(`Parsed: M=${dA.length}, Z=${dB.length}, I=${dC.length}. Matching...`, 'success');
        discrepancies = reconcile(dA, dB, dC);
        renderTable(discrepancies);
        
      } catch (e) {
        log(`❌ ${e.message}`, 'error');
        if (e.message.includes('User not found') || e.message.includes('401')) {
          log('💡 Aktifkan "Mode Offline" atau perbaiki API Key', 'error');
        }
      } finally {
        btn.disabled = false;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#10b981;">✅ Semua match!</td></tr>';
      } else {
        data.forEach(r => {
          const fmt = d => d ? `Rp ${amt(d.amount).toLocaleString('id-ID')}` : '-';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><code>${r.rule}</code></td>
            <td><code>${r.ref}</code></td>
            <td>${fmt(r.m)}</td>
            <td>${fmt(r.z)}</td>
            <td>${fmt(r.i)}</td>
            <td class="${r.sel>100?'diff-high':''}">Rp ${r.sel.toLocaleString('id-ID')}</td>
            <td>${r.issue}</td>`;
          tbody.appendChild(tr);
        });
      }
      
      document.getElementById('resultContainer').classList.remove('hidden');
      document.getElementById('btnExport').style.display = data.length ? 'block' : 'none';
    }

    function amt(v) { return parseFloat(v) || 0; }

    function exportCSV() {
      if (!discrepancies.length) return;
      let csv = 'RULE,REFERENCE,MINERAPAY,ZONAMAIN,IDN,SELISIH,KETERANGAN\n';
      discrepancies.forEach(r => {
        csv += `"${r.rule}","${r.ref}",${r.m?.amount||0},${r.z?.amount||0},${r.i?.amount||0},${r.sel},"${r.issue}"\n`;
      });
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `selisih_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
  </script>
</body>
</html>
