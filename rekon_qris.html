<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekonsiliasi QRIS 3 Sumber</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0; --primary: #2563eb; --danger: #dc2626; --success: #10b981; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: auto; background: var(--card); padding: 24px; border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-bottom: 12px; font-size: 1.6rem; }
    .warning { background: #fff3cd; color: #856404; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 18px; text-align: center; border: 1px solid #ffeaa7; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    label { font-weight: 500; font-size: 0.9rem; }
    select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #f8fafc; }
    .demo-toggle { display: flex; align-items: center; gap: 8px; background: #f0fdf4; padding: 8px 12px; border-radius: 8px; border: 1px solid #bbf7d0; cursor: pointer; }
    .sources-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .source-box { background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid var(--border); position: relative; }
    .source-box h3 { margin-bottom: 10px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
    textarea { min-height: 120px; resize: vertical; font-family: monospace; font-size: 0.85rem; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .drop-zone { margin-top: 8px; padding: 10px; border: 2px dashed #cbd5e1; border-radius: 8px; text-align: center; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .btn-clipboard { background: #f1f5f9; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-left: auto; }
    .btn-clear { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; margin-left: 8px; }
    button.process { background: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.2s; margin-bottom: 8px; }
    button.process:hover { background: #1d4ed8; }
    button.process:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 12px; text-align: center; font-weight: 500; min-height: 24px; padding: 8px; border-radius: 6px; background: #f8fafc; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.85rem; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: #f8fafc; position: sticky; top: 0; }
    .diff-high { color: var(--danger); font-weight: bold; }
    .export-btn { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; display: none; }
    .hidden { display: none; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-mz { background: #e0e7ff; color: #3730a3; }
    .badge-zi { background: #fce7f3; color: #9d174d; }
    .badge-mi { background: #ccfbf1; color: #115e59; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Rekonsiliasi QRIS (MINERAPAY | ZONAMAIN | IDN)</h1>
    <div class="warning">⚠️ Format data sudah disesuaikan. MINERAPAY→ZONAMAIN match by Order ID.</div>
    
    <div class="controls">
      <label>🤖 Model AI:</label>
      <select id="modelSelect">
        <option value="openai/gpt-4o-mini">gpt-4o-mini</option>
        <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B</option>
      </select>
      <label class="demo-toggle">
        <input type="checkbox" id="demoMode"> 🧪 Mode Demo (Tanpa API)
      </label>
    </div>

    <div id="status"></div>

    <div class="sources-grid">
      <div class="source-box" id="box-minera">
        <h3>📦 MINERAPAY <div><button class="btn-clipboard" onclick="pasteFromClipboard('paste-minera')">📋 Paste</button><button class="btn-clear" onclick="clearSource('paste-minera')">✖</button></div></h3>
        <textarea id="paste-minera" placeholder="Paste data MINERAPAY (tab-separated)..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-minera').click()">📁 Drop file atau klik</div>
        <input type="file" id="file-minera" class="hidden" accept=".csv,.txt,.xlsx,.json" onchange="handleFile(this, 'paste-minera')">
      </div>

      <div class="source-box" id="box-zona">
        <h3>📦 ZONAMAIN <div><button class="btn-clipboard" onclick="pasteFromClipboard('paste-zona')">📋 Paste</button><button class="btn-clear" onclick="clearSource('paste-zona')">✖</button></div></h3>
        <textarea id="paste-zona" placeholder="Paste data ZONAMAIN (tab-separated)..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-zona').click()">📁 Drop file atau klik</div>
        <input type="file" id="file-zona" class="hidden" accept=".csv,.txt,.xlsx,.json" onchange="handleFile(this, 'paste-zona')">
      </div>

      <div class="source-box" id="box-idn">
        <h3>📦 IDN <div><button class="btn-clipboard" onclick="pasteFromClipboard('paste-idn')">📋 Paste</button><button class="btn-clear" onclick="clearSource('paste-idn')">✖</button></div></h3>
        <textarea id="paste-idn" placeholder="Paste data IDN..."></textarea>
        <div class="drop-zone" onclick="document.getElementById('file-idn').click()">📁 Drop file atau klik</div>
        <input type="file" id="file-idn" class="hidden" accept=".csv,.txt,.xlsx,.json" onchange="handleFile(this, 'paste-idn')">
      </div>
    </div>

    <button class="process" id="btnProcess" onclick="startReconciliation()">🚀 Proses Rekonsiliasi</button>

    <div id="resultContainer" class="hidden">
      <table id="resultTable">
        <thead>
          <tr>
            <th>Rule Matching</th>
            <th>Reference</th>
            <th>MINERAPAY</th>
            <th>ZONAMAIN</th>
            <th>IDN</th>
            <th>Selisih / Count</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <button class="export-btn" id="btnExport" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      API_KEY: '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',
      API_URL: 'https://openrouter.ai/api/v1',
      REFERER: window.location.href
    };

    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btnProcess');
    let discrepancies = [];

    function log(msg, type='info') { 
      statusEl.style.background = type==='success' ? '#d1fae5' : type==='error' ? '#fee2e2' : '#f8fafc';
      statusEl.style.color = type==='success' ? '#065f46' : type==='error' ? '#991b1b' : '#2563eb';
      statusEl.innerHTML = type==='loading' ? `<span class="spinner"></span> ${msg}` : msg; 
    }

    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', e => {
        e.preventDefault(); zone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleFileInput(e.dataTransfer.files[0], zone.previousElementSibling.id);
      });
    });

    function handleFile(input, targetId) { if (input.files[0]) handleFileInput(input.files[0], targetId); }
    async function handleFileInput(file, targetId) {
      log(`Membaca ${file.name}...`, 'loading');
      try {
        let text = file.name.endsWith('.xlsx') 
          ? XLSX.utils.sheet_to_csv(XLSX.read(await file.arrayBuffer(), {type:'array'}).Sheets[XLSX.read(await file.arrayBuffer(), {type:'array'}).SheetNames[0]])
          : await file.text();
        document.getElementById(targetId).value = text;
        log(`File ${file.name} berhasil dimuat.`, 'success');
      } catch (err) { log(`Gagal baca file: ${err.message}`, 'error'); }
    }

    async function pasteFromClipboard(targetId) {
      try {
        document.getElementById(targetId).value = await navigator.clipboard.readText();
        log('Clipboard berhasil ditempel.', 'success');
      } catch (err) { log('Gagal akses clipboard. Pakai Ctrl+V.', 'error'); }
    }
    function clearSource(targetId) { document.getElementById(targetId).value = ''; }

    function getDemoData() {
      return {
        minera: [
          { order_id: 'af7077f8-9275-4ab4-8f53-bc60a571ef6f', user_id: 'U100', amount: 150000, status: 'success' },
          { order_id: 'bd06fe2a-6b9d-4965-a3df-e8c98c941527', user_id: 'U101', amount: 450000, status: 'success' }
        ],
        zona: [
          { order_id: 'af7077f8-9275-4ab4-8f53-bc60a571ef6f', user_id: 'U100', amount: 150000, status: 'success' },
          { order_id: 'bd06fe2a-6b9d-4965-a3df-e8c98c941527', user_id: 'U101', amount: 450000, status: 'success' }
        ],
        idn: [
          { order_id: '', user_id: 'U100', amount: 150000, status: 'success' },
          { order_id: '', user_id: 'U101', amount: 450000, status: 'success' }
        ]
      };
    }

    async function parseWithAI(raw, source, model) {
      let prompt = '';
      
      if (source === 'MINERAPAY') {
        prompt = `Anda adalah parser data MINERAPAY. Data format: TAB-separated values.
Struktur kolom (berurutan):
1. Transaction UUID
2. Order ID (UUID) ← INI YANG PENTING
3. Amount (angka tanpa koma)
4. Fee
5. Net Amount
6. Payment Type (QRIS)
7. Status (success/failed/pending)
8-14. Kolom kosong/extra
15. Timestamp created
16-20. Timestamp lainnya
21. User info (format: username||hash)
22. Currency (IDR)
23-25. Extra UUID/IP

Tugas: Ekstrak menjadi JSON array. Setiap objek WAJIB punya:
- "order_id": ambil dari kolom ke-2 (UUID format)
- "amount": ambil dari kolom ke-3 (angka)
- "status": ambil dari kolom ke-7 (success/failed/pending)
- "user_id": ambil dari kolom ke-21 (extract username sebelum ||)

Data mentah (TAB-separated):
${raw.substring(0, 3000)}

Output HARUS valid JSON dengan key "transactions". Jangan buat data fiktif.`;
      }
      else if (source === 'ZONAMAIN') {
        prompt = `Anda adalah parser data ZONAMAIN. Data format: TAB-separated values.
Struktur kolom (berurutan):
1. Timestamp
2. Site/Game name
3. Provider (MINERAPAY)
4. Order ID (UUID) ← INI YANG PENTING
5. User phone/ID (dengan tanda ')
6. Provider name
7. Username
8. Payment method
9. Amount (dengan koma, contoh: 450,000.00)
10. Fee (dengan koma)
11. Net Amount (dengan koma)

Tugas: Ekstrak menjadi JSON array. Setiap objek WAJIB punya:
- "order_id": ambil dari kolom ke-4 (UUID format)
- "amount": ambil dari kolom ke-9 (hapus koma, jadi angka)
- "status": "success" (asumsikan success jika ada di data)
- "user_id": ambil dari kolom ke-7 (username)

Data mentah (TAB-separated):
${raw.substring(0, 3000)}

Output HARUS valid JSON dengan key "transactions". Jangan buat data fiktif.`;
      }
      else if (source === 'IDN') {
        prompt = `Anda adalah parser data IDN Play/QRIS. Ekstrak data menjadi JSON array.
Setiap objek WAJIB punya:
- "order_id": ID transaksi (jika ada)
- "user_id": User ID/member ID
- "amount": nominal transaksi (angka, hapus koma/simbol)
- "status": success/failed/pending

Data mentah:
${raw.substring(0, 3000)}

Output HARUS valid JSON dengan key "transactions". Jangan buat data fiktif.`;
      }
      
      const res = await fetch(`${CONFIG.API_URL}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.API_KEY}`, 'HTTP-Referer': CONFIG.REFERER, 'X-Title': 'QRIS Reconciler' },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0, response_format: { type: 'json_object' } })
      });
      
      const json = await res.json();
      if (!res.ok) {
        const msg = json.error?.message || `HTTP ${res.status}`;
        if (res.status === 401) throw new Error("401: Key invalid atau belum payment method. Cek https://openrouter.ai/billing");
        throw new Error(`API Error: ${msg}`);
      }
      const parsed = JSON.parse(json.choices[0].message.content);
      return Array.isArray(parsed) ? parsed : (parsed.transactions || []);
    }

    function reconcile(minera, zona, idn) {
      const results = [];
      const norm = (val) => String(val || '').trim();
      const amt = (val) => parseFloat(val) || 0;
      const round100 = (v) => Math.round(amt(v) * 100);
      const add = (rule, ref, m, z, i, val, issue) => results.push({ rule, ref, m, z, i, val, issue });

      // 1. MINERAPAY ↔ ZONAMAIN (Order ID)
      const zonaByOrder = new Map(); zona.forEach(z => { if(z.order_id) zonaByOrder.set(norm(z.order_id), z); });
      const mOrderUsed = new Set();
      for (const m of minera) {
        if (!m.order_id) continue;
        const oid = norm(m.order_id); mOrderUsed.add(oid);
        const z = zonaByOrder.get(oid);
        if (!z) add('M ↔ Z (Order ID)', oid, m, null, null, amt(m.amount), 'Tidak ada di ZONAMAIN');
        else if (Math.abs(round100(m.amount) - round100(z.amount)) > 0) add('M ↔ Z (Order ID)', oid, m, z, null, Math.abs(amt(m.amount)-amt(z.amount)), 'Selisih nominal');
      }
      for (const z of zona) { if(z.order_id && !mOrderUsed.has(norm(z.order_id))) add('M ↔ Z (Order ID)', norm(z.order_id), null, z, null, amt(z.amount), 'Tidak ada di MINERAPAY'); }

      // 2. ZONAMAIN ↔ IDN (User ID + Nominal)
      const idnByUserAmt = new Map();
      idn.forEach(i => { if(i.user_id) { const k=`${norm(i.user_id)}_${round100(i.amount)}`; if(!idnByUserAmt.has(k)) idnByUserAmt.set(k,[]); idnByUserAmt.get(k).push(i); } });
      for (const z of zona) {
        if (!z.user_id) continue;
        const key = `${norm(z.user_id)}_${round100(z.amount)}`;
        const matches = idnByUserAmt.get(key) || [];
        if (matches.length === 0) add('Z ↔ I (UserID+Nominal)', `${z.user_id} | Rp${amt(z.amount).toLocaleString('id-ID')}`, null, z, null, amt(z.amount), 'Tidak match di IDN');
        else if (matches.length > 1) add('Z ↔ I (UserID+Nominal)', `${z.user_id} | Rp${amt(z.amount).toLocaleString('id-ID')}`, null, z, matches[0], 0, `Duplikat ${matches.length}x di IDN`);
      }

      // 3. MINERAPAY ↔ IDN (Nominal saja -> batch count)
      const countMap = (arr) => { const m=new Map(); arr.forEach(d=>{const k=round100(d.amount);m.set(k,(m.get(k)||0)+1)}); return m; };
      const mC = countMap(minera), iC = countMap(idn);
      for (const [k, cM] of mC) { const cI = iC.get(k)||0; if(cM!==cI) add('M ↔ I (Nominal)', `Batch Rp${(k/100).toLocaleString('id-ID')}`, {amount:k/100}, null, {amount:k/100}, Math.abs(cM-cI), `Jumlah trx beda: M=${cM}, I=${cI}`); }

      return results;
    }

    async function startReconciliation() {
      const isDemo = document.getElementById('demoMode').checked;
      let dA, dB, dC;

      btn.disabled = true; 
      document.getElementById('resultContainer').classList.add('hidden');
      try {
        if (isDemo) {
          log('🧪 Mode Demo: Menggunakan data sampel...', 'loading');
          await new Promise(r => setTimeout(r, 600));
          const demo = getDemoData();
          dA = demo.minera; dB = demo.zona; dC = demo.idn;
        } else {
          const model = document.getElementById('modelSelect').value;
          const rawA = document.getElementById('paste-minera').value.trim();
          const rawB = document.getElementById('paste-zona').value.trim();
          const rawC = document.getElementById('paste-idn').value.trim();
          if (!rawA || !rawB || !rawC) return log('⚠️ Data ketiga sumber wajib diisi', 'error');

          log('AI parsing MINERAPAY...', 'loading'); dA = await parseWithAI(rawA, 'MINERAPAY', model);
          log('AI parsing ZONAMAIN...', 'loading'); dB = await parseWithAI(rawB, 'ZONAMAIN', model);
          log('AI parsing IDN...', 'loading'); dC = await parseWithAI(rawC, 'IDN', model);
        }

        log(`Parsing selesai (${dA.length} | ${dB.length} | ${dC.length}). Menghitung selisih...`, 'success');
        discrepancies = reconcile(dA, dB, dC);
        renderTable(discrepancies);
      } catch (e) { 
        log(`❌ ${e.message}`, 'error'); 
        console.error(e); 
      } finally { 
        btn.disabled = false; 
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
      if (!data.length) { 
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#10b981;">✅ Tidak ditemukan selisih. Semua match!</td></tr>'; 
        document.getElementById('resultContainer').classList.remove('hidden'); 
        document.getElementById('btnExport').style.display='none'; 
        return; 
      }
      const badgeClass = (r) => r.includes('M ↔ Z') ? 'badge-mz' : r.includes('Z ↔ I') ? 'badge-zi' : 'badge-mi';
      data.forEach(row => {
        const fmtAmt = (d) => d ? `Rp ${(parseFloat(d.amount)||0).toLocaleString('id-ID')}<br><small>${d.status||''}</small>` : '<small style="color:#94a3b8">-</small>';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="badge ${badgeClass(row.rule)}">${row.rule}</span></td>
          <td><strong>${row.ref}</strong></td>
          <td>${fmtAmt(row.m)}</td>
          <td>${fmtAmt(row.z)}</td>
          <td>${fmtAmt(row.i)}</td>
          <td class="${row.val>100?'diff-high':''}">${typeof row.val==='number'?`Rp ${row.val.toLocaleString('id-ID')}`:row.val}</td>
          <td>${row.issue}</td>`;
        tbody.appendChild(tr);
      });
      document.getElementById('resultContainer').classList.remove('hidden');
      document.getElementById('btnExport').style.display = 'block';
      log(`Ditemukan ${data.length} discrepancy.`, 'success');
    }

    function exportCSV() {
      if (!discrepancies.length) return;
      let csv = 'RULE,REFERENCE,MINERAPAY_AMOUNT,ZONAMAIN_AMOUNT,IDN_AMOUNT,SELISIH_COUNT,KETERANGAN\n';
      discrepancies.forEach(r => {
        csv += `"${r.rule}","${r.ref}",${r.m?.amount||0},${r.z?.amount||0},${r.i?.amount||0},${r.val},"${r.issue}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `selisih_qris_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
